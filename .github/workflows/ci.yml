name: CloudOps CI/CD

on:
  push:
    branches:
      - main
      - ci-cd
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cloudops-autodeploy
  EC2_INSTANCE_ID: i-083e21bfda7c32616

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check application
        run: |
          python -m py_compile app/app.py

      - name: Build Docker image
        run: |
          docker build -t cloudops-autodeploy:test .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build production Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 using SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DEPLOY_SCRIPT=$(cat <<EOF
          set -e

          echo "Logging in to Amazon ECR..."
          aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

          echo "Pulling new Docker image..."
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Stopping old container..."
          docker stop cloudops-app || true

          echo "Removing old container..."
          docker rm cloudops-app || true

          echo "Starting new container..."
          docker run -d \
            --name cloudops-app \
            --restart unless-stopped \
            -p 8080:5000 \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Checking application health..."
          sleep 5
          curl -f http://localhost:8080/health

          echo "Deployment successful!"
          EOF
          )

          COMMANDS=$(jq -nc --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          aws ssm send-command \
            --region $AWS_REGION \
            --instance-ids $EC2_INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --comment "CloudOps AutoDeploy - ${GITHUB_SHA}" \
            --parameters "$COMMANDS"
